<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn2X | Premium Task Marketplace</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; overflow-x: hidden; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #0b0f19; padding-bottom: 90px; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; }
        .view-section { display: none; padding: 16px; }
        .view-section.active { display: block; }
        .glass-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 16px; backdrop-filter: blur(8px); margin-bottom: 16px; }
        .gradient-border-btn { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 14px; width: 100%; cursor: pointer; display: block; text-align: center; text-decoration: none; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); }
        .secondary-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-weight: 600; font-size: 13px; width: 100%; cursor: pointer; text-align: center; display: block; text-decoration: none; }
        .btn-admin { background: #dc2626; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }
        input, textarea, select { width: 100%; padding: 12px; background: #111827; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 14px; margin-top: 6px; margin-bottom: 14px; }
        .platform-navbar { background: rgba(11, 15, 25, 0.85); border-bottom: 1px solid #1e293b; padding: 16px; position: sticky; top: 0; backdrop-filter: blur(12px); z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-size: 20px; font-weight: 800; color: #3b82f6; }
        .bottom-nav-bar { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: #0b0f19; border-top: 1px solid #1e293b; display: grid; grid-template-columns: repeat(5, 1fr); padding: 12px 0; z-index: 999; }
        .nav-item { text-align: center; background: none; border: none; color: #64748b; font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: #3b82f6; }
        .progress-track { width: 100%; background: #1e293b; height: 8px; border-radius: 99px; overflow: hidden; margin: 8px 0; }
        .progress-fill { background: linear-gradient(90deg, #10b981 0%, #059669 100%); height: 100%; border-radius: 99px; }
        .badge { display: inline-block; padding: 4px 8px; font-size: 10px; font-weight: 700; border-radius: 6px; text-transform: uppercase; }
        .badge-active { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-admin { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .task-card { background: rgba(30, 41, 59, 0.2); border: 1px solid #1e293b; border-left: 4px solid #3b82f6; padding: 14px; border-radius: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="platform-navbar">
            <span class="logo-text">EARN<span style="color:white;">2X</span></span>
            <span id="role-badge" class="badge badge-admin" onclick="switchSection('admin')">👑 CEO Dashboard</span>
        </header>
        <div id="view-home" class="view-section active">
            <div class="glass-card" style="text-align:center; padding: 32px 16px;">
                <h1 style="font-size:26px; font-weight:800; line-height:1.2; margin-bottom:12px; color:white;">Complete Legitimate <br><span style="color:#3b82f6;">Digital Tasks.</span></h1>
                <p style="color:#94a3b8; font-size:13px; margin-bottom:24px;">Nigeria's premium verified task marketplace. Purchase a 3-month access pass to start earning disclosed rewards.</p>
                <button class="gradient-border-btn" style="margin-bottom:12px;" onclick="switchSection('dashboard')">Enter Customer Dashboard</button>
                <button class="secondary-btn" onclick="switchSection('plans')">View Membership Access Plans</button>
            </div>
        </div>
